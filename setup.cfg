[metadata]
name = bipartitepandas
version = 1.1.12
author = Thibaut Lamadon
author_email = thibaut.lamadon@gmail.com
description = Python tools for bipartite labor data
long_description = file: README.rst
long_description_content_type = text/x-rst
url = https://github.com/tlamadon/bipartitepandas/
project_urls =
    Documentation = https://tlamadon.github.io/bipartitepandas/
    GitHub = https://github.com/tlamadon/bipartitepandas/
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.13
install_requires =
    paramsdict >= 0.0.3
    numpy >= 1.26.0
    pandas >= 2.0.0
    scipy >= 1.11.0
    scikit-learn >= 1.3.0
    statsmodels >= 0.14.0
    igraph >= 0.10.0
    tqdm
    pyarrow >= 14.0.0
    numba >= 0.59.0


[options.extras_require]
dev =
    pytest
    pytest-cov
    pyarrow
