package:
  name: bipartitepandas
  version: "{{ GIT_DESCRIBE_TAG }}"

source:
  path: .

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - hatch-vcs
    - hatchling
    - pip
    - python >=3.13
  run:
    - igraph >=0.10.0
    - numba >=0.59.0
    - numpy >=1.26.0
    - pandas >=2.0.0
    - paramsdict >=0.0.3
    - pyarrow >=14.0.0
    - python >=3.13
    - scikit-learn >=1.3.0
    - scipy >=1.11.0
    - statsmodels >=0.14.0
    - tqdm

about:
  home: https://github.com/tlamadon/bipartitepandas
  license: MIT
  license_file: LICENSE
  summary: Python tools for bipartite labor data

  description: |
    BipartitePandas is a Python package for handling bipartite labor data.

extra:
  recipe-maintainers:
    - tlamadon
