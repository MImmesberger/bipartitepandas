[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "bipartitepandas"
description = "Python tools for bipartite labor data"
readme = "README.rst"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Thibaut Lamadon", email = "thibaut.lamadon@gmail.com" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dynamic = ["version"]
dependencies = [
    "igraph>=0.10.0",
    "numba>=0.59.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "paramsdict>=0.0.3",
    "pyarrow>=14.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "tqdm",
]

[project.optional-dependencies]
docs = ["nbsphinx", "sphinx", "sphinx-rtd-theme"]

[project.urls]
Documentation = "https://tlamadon.github.io/bipartitepandas/"
Homepage = "https://github.com/tlamadon/bipartitepandas/"
Repository = "https://github.com/tlamadon/bipartitepandas/"

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/docs", "/tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/bipartitepandas"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.ruff]
fix = true
line-length = 88
src = ["src"]
target-version = "py313"

[tool.ruff.lint]
extend-ignore = [
    "ANN", "COM812", "D1", "EM", "ERA001", "FBT", "ISC001",
    "N803", "N806", "PD", "PLR0912", "PLR0913", "PLR0915",
    "PLR2004", "S101", "TRY003",
]
select = ["ALL"]

[tool.ruff.lint.isort]
force-single-line = true
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "INP001", "PLR2004", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
minversion = "8.0"
testpaths = ["tests"]
xfail_strict = true

[tool.ty]
python-version = "3.13"
src = ["src"]
